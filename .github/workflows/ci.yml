name: cross-platform-ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check npm launcher syntax
        run: node --check bin/taskforge.js
      - name: Test process collector
        run: npm test
      - name: Smoke-test live snapshot
        run: node bin/taskforge.js snapshot
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke-test live workflow trace
        run: node bin/taskforge.js trace examples/cpu-workflow.json
      - name: Test literal executable arguments
        run: node bin/taskforge.js trace tests/fixtures/args-workflow.json
      - name: Pack installable npm artifact
        run: npm pack
      - name: Install packed CLI
        run: npm install -g ./taskforge-scheduler-1.1.0.tgz
      - name: Smoke-test installed CLI
        run: taskforge trace tests/fixtures/args-workflow.json
      - name: Verify installed CLI working directory
        run: node --test tests/installed-cli.test.js
