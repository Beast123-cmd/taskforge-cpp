<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskForge Observatory</title><style>
body{margin:0;background:#0b1020;color:#e8edf7;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px}h1{margin:0}.sub{color:#9aa8c7}.top{display:flex;justify-content:space-between;align-items:center}button{background:#6d5dfc;color:white;border:0;border-radius:8px;padding:10px 16px;font-weight:bold;cursor:pointer}.cards,.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(5,1fr);margin:24px 0}.card,section{background:#151d33;border:1px solid #253252;border-radius:12px;padding:16px}.num{font-size:28px;font-weight:bold;color:#a99fff}.grid{grid-template-columns:1fr 1fr}.node{display:inline-block;padding:8px 12px;margin:7px;border-radius:7px;background:#21345d;border-left:4px solid #64d7c4}.edge{color:#7789b3}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #273454}.event{font-family:ui-monospace,monospace;padding:5px 0;border-bottom:1px solid #24314d;color:#c8d3ed}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head>
<body><main><div class="top"><div><h1>TaskForge Observatory</h1><p class="sub">Real telemetry emitted by the C++ scheduling engine.</p></div><button onclick="load()">Run demo again</button></div><div id="content">Loading engine telemetry…</div></main><script>
function graph(jobs){return jobs.map(j=>`<div class=node><b>${j.id}</b><br><small>${j.state} · ${j.priority}</small><br><span class=edge>${j.dependencies.length?'depends on ← '+j.dependencies.join(', '):'entry job'}</span></div>`).join('')}
function load(){fetch('/api/demo').then(r=>r.json()).then(d=>{if(d.error)throw Error(d.error);let m=d.metrics;content.innerHTML=`<div class=cards>${[['Submitted',m.submitted],['Completed',m.completed],['Failed',m.failed],['Retries',m.retries],['Peak concurrency',m.peakRunning]].map(x=>`<div class=card><div class=sub>${x[0]}</div><div class=num>${x[1]}</div></div>`).join('')}</div><div class=grid><section><h2>Dependency flow</h2>${graph(d.jobs)}</section><section><h2>Job state table</h2><table><tr><th>Job</th><th>State</th><th>Priority</th></tr>${d.jobs.map(j=>`<tr><td>${j.id}</td><td>${j.state}</td><td>${j.priority}</td></tr>`).join('')}</table></section></div><section style="margin-top:16px"><h2>Scheduler event timeline</h2>${d.events.map(e=>`<div class=event>+${e.elapsedMs}ms · ${e.jobId} · ${e.state} — ${e.message}</div>`).join('')}</section>`}).catch(e=>content.innerHTML=`<section><h2>Engine unavailable</h2><pre>${e.message}</pre></section>`)}load();
</script></body></html>
